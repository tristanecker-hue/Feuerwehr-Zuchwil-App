<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drehleiter Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{--bg:#0f1216;--panel:rgba(18,22,28,.82);--line:#2b333d;--ink:#eef1f4;--mut:#9aa5b1;--red:#e5392d;--grn:#37b36b;--amb:#f0a229;--hud:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--hud);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
:root{padding:0!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column;gap:8px;padding:10px 16px;pointer-events:none;background:linear-gradient(#0f1216cc,#0f121600 90%)}.top>*{pointer-events:auto}.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}.row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}.row>*{pointer-events:auto}
.bar h1{margin:0 auto 0 0;font-size:20px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}.bar h1 b{color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);cursor:pointer}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:15px;font-weight:600;letter-spacing:.03em;min-height:34px}
.chip.on{background:var(--red);border-color:var(--red)}
.hud{display:flex;flex-wrap:wrap;gap:2px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:17px;max-width:calc(100% - 32px)}
.hud.off{display:none}.hud span{color:var(--mut);white-space:nowrap}.hud b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);margin-left:3px}
.task.gone{display:none}.task{max-width:300px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:17px;line-height:1.2}
.task b{display:block;font-size:13px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.task{position:relative;padding-right:30px}.task .tx{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:#ffffff1f;font-size:14px;line-height:1;padding:0}
.task.done{border-color:var(--grn)}.task .t{color:var(--grn);font-weight:700}
.msg{position:fixed;left:50%;transform:translateX(-50%);top:46%;background:#000b;border:1px solid var(--amb);color:var(--amb);padding:8px 16px;border-radius:10px;font-size:19px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:90%}
.msg.on{opacity:1}
.dock.off{display:none}.chip.off{display:none}#ke.on{background:var(--grn);border-color:var(--grn)}.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.lv{display:flex;flex-direction:column;align-items:center;gap:4px}
.lv small{color:var(--mut);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.plate{position:relative;width:min(36vw,160px);aspect-ratio:4/5.9;background:linear-gradient(#ececec,#d6d6d6);border:1px solid #fff5;border-radius:12px;box-shadow:inset 0 0 0 2px #0002}
.tile{position:absolute;left:13%;width:74%;bottom:5%;aspect-ratio:100/90;border-radius:2px;overflow:hidden;pointer-events:none}.tile svg{display:block;width:100%;height:100%}
.knob{position:absolute;left:50%;top:33%;width:46%;aspect-ratio:1;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 40% 32%,#f4f4f4 0,#b9b9b9 38%,#6b6b6b 72%,#3a3a3a 100%);border:2px solid #0007;box-shadow:0 0 0 5px #c9c9c9,0 0 0 6px #444,0 0 0 11px #dcdcdc,0 0 0 12px #444,0 8px 14px #0007;touch-action:none;cursor:grab}
.drive{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(36px + env(safe-area-inset-bottom,0px));display:flex;gap:16px;z-index:4}.drive.off{display:none}.drive button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 26px;min-height:68px;min-width:130px;font-size:21px;font-weight:700;letter-spacing:.04em;touch-action:none;-webkit-user-select:none}.drive button.on{background:var(--grn);border-color:var(--grn)}
.frei{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:4px}
#fr{width:min(24vw,120px);aspect-ratio:1;border-radius:50%;border:3px solid #fff3;background:radial-gradient(circle at 35% 30%,#f2644f,#a3211a 75%);font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;box-shadow:0 6px 16px #0009;touch-action:none}
#fr.on{background:radial-gradient(circle at 35% 30%,#5fe09a,#1f8c52 75%);border-color:#fff8}
.frei small{color:var(--mut);font-size:14px;text-align:center;max-width:130px;line-height:1.05}
.help{position:fixed;left:16px;bottom:230px;color:var(--mut);font-size:14px;max-width:min(330px,60vw);line-height:1.15;text-shadow:0 1px 3px #000}
@media(max-width:620px){.help{display:none}.bar h1{display:none}.chip{padding:3px 9px;font-size:13px;min-height:28px}.chips{gap:5px}.top{gap:6px;padding:8px 12px}.hud{font-size:13px;padding:5px 9px;gap:2px 12px}.task{font-size:14px;padding:6px 9px;max-width:100%;width:100%;box-sizing:border-box}.hud span,.hud b{white-space:nowrap}.plate{width:min(34vw,140px)}#fr{width:min(22vw,92px);font-size:12px}.frei small{font-size:12px;max-width:95px}.dock{padding-left:10px;padding-right:10px}.task b{font-size:11px}.task .chip{font-size:13px}.row{flex-direction:column;align-items:stretch}}
</style>
<canvas id="cv"></canvas>
<div class="top"><div class="bar"><h1>Drehleiter <b>Simulator</b> · L32A-XS</h1>
<div class="chips" id="views"><button class="chip on" data-v="ov">Übersicht</button><button class="chip" data-v="st">Bedienstand</button><button class="chip" data-v="ko">Im Korb</button></div>
<div class="chips"><button class="chip off" id="ke">Korbeinstieg</button><button class="chip" id="sup">Stützen ausfahren</button><button class="chip" id="swp">Belegung A</button><button class="chip" id="bl">Blaulicht</button><button class="chip" id="wb">Warnblinker</button><button class="chip" id="tk">Aufgabe</button><button class="chip" id="hv">Werte</button></div></div>
<div class="row"><div class="hud off" id="hud"></div>
<div class="task" id="task"></div></div></div>
<div class="msg" id="msg"></div>
<div class="help">Zuerst den Freigabetaster antippen (bleibt aktiv), danach den Hebel bewegen. Tastatur: Leertaste = Freigabe · W A S D = linker Hebel · Pfeiltasten = rechter Hebel. Ansicht ziehen = drehen, Mausrad = zoomen.</div>
<div class="drive" id="drive"><button id="dfwd">◀ Vor</button><button id="dback">Zurück ▶</button></div>
<div class="dock off" id="dock">
<div class="lv"><div class="plate" id="pl"><div class="knob" id="kl"></div><div class="tile" id="tl"></div></div><small>Linker Hebel</small></div>
<div class="frei"><button id="fr">Freigabe<br>aus</button><small id="fs">Antippen zum Aktivieren</small></div>
<div class="lv"><div class="plate" id="pr"><div class="knob" id="kr"></div><div class="tile" id="tr"></div></div><small>Rechter Hebel</small></div>
</div>
